
name: testgen

x-common-variables: &common-variables
  TESTGEN_USERNAME: ${TESTGEN_USERNAME}
  TESTGEN_PASSWORD: ${TESTGEN_PASSWORD}
  TG_DECRYPT_SALT: ${TG_DECRYPT_SALT}
  TG_DECRYPT_PASSWORD: ${TG_DECRYPT_PASSWORD}
  TG_METADATA_DB_HOST: postgres
  TG_TARGET_DB_TRUST_SERVER_CERTIFICATE: yes
  TG_EXPORT_TO_OBSERVABILITY_VERIFY_SSL: no


services:
  engine:
    image: datakitchen/dataops-testgen:v2
    # Must exceed TG_JOB_SHUTDOWN_TIMEOUT (default 60s), or docker kills the scheduler
    # mid-wait and running jobs are cut instead of stopping at a checkpoint.
    stop_grace_period: 90s
    container_name: testgen
    environment: *common-variables
    volumes:
      - testgen_data:/var/lib/testgen
      # Data files TestGen reads in place, for a Files connection. Uncomment and point the left
      # side at the directory on this machine that holds them; the right side is the Base Path to
      # enter on the connection. Read-only, because TestGen never writes to target data. The files
      # have to be readable by the container's user, which is the unprivileged `testgen` account
      # rather than root -- `docker compose exec engine id` prints the uid to grant.
      # - /data:/data:ro
    ports:
      - 8501:8501
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - postgres
    networks:
      - datakitchen

  postgres:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=${TESTGEN_USERNAME}
      - POSTGRES_PASSWORD=${TESTGEN_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TESTGEN_USERNAME}"]
      interval: 8s
      timeout: 5s
      retries: 3
    networks:
      - datakitchen

volumes:
  postgres_data:
  testgen_data:

networks:
  datakitchen:
    name: datakitchen-network
    external: true
