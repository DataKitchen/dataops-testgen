IS_NUM: CASE
            WHEN REGEXP_LIKE({$1}, '^\s*[+-]?\$?\s*[0-9]+(,[0-9]{3})*(\.[0-9]*)?[%]?\s*$') THEN 1
            ELSE 0
        END

IS_DATE: CASE
            /* YYYY-MM-DD HH:MM:SS SSSSSS or YYYY-MM-DD HH:MM:SS */
            WHEN REGEXP_LIKE({$1}, '^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])\s(2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9])(\s[0-9]{6})?$')
                              THEN CASE
                                                          WHEN CAST(SUBSTR({$1}, 1, 4) AS INTEGER) BETWEEN 1800 AND 2200
      AND (
      ( SUBSTRING ({$1}, 6, 2) IN ('01', '03', '05', '07', '08',
      '10', '12')
      AND CAST(SUBSTRING ({$1}, 9, 2) AS INTEGER) BETWEEN 1 AND 31 )
      OR ( SUBSTRING ({$1}, 6, 2) IN ('04', '06', '09')
      AND CAST(SUBSTRING ({$1}, 9, 2) AS INTEGER) BETWEEN 1 AND 30 )
      OR ( SUBSTRING ({$1}, 6, 2) = '02'
      AND CAST(SUBSTRING ({$1}, 9, 2) AS INTEGER) BETWEEN 1 AND 29)
      )
      THEN 1
      ELSE 0
    END
                          /* YYYYMMDDHHMMSSSSSS or YYYYMMDD */
  WHEN REGEXP_LIKE({$1}, '^(\d{4})(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])(2[0-3]|[01][0-9])([0-5][0-9])([0-5][0-9])([0-9]{6})$')
    OR REGEXP_LIKE({$1}, '^(\d{4})(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])(2[0-3]|[01][0-9])$')
                              THEN CASE
                                    WHEN CAST(SUBSTR({$1}, 1, 4) AS INTEGER) BETWEEN 1800 AND 2200
                                        AND (
                                              ( SUBSTRING({$1}, 5, 2) IN ('01', '03', '05', '07', '08',
                                                                                  '10', '12')
                                                AND CAST(SUBSTRING({$1}, 7, 2) AS INTEGER) BETWEEN 1 AND 31 )
                                            OR  ( SUBSTRING({$1}, 5, 2) IN ('04', '06', '09')
                                                    AND CAST(SUBSTRING({$1}, 7, 2) AS INTEGER) BETWEEN 1 AND 30 )
                                            OR  ( SUBSTRING({$1}, 5, 2)  = '02'
                                                    AND CAST(SUBSTRING({$1}, 7, 2) AS INTEGER) BETWEEN 1 AND 29)
                                            )
                                        THEN 1
                                      ELSE 0
  END
                          /* Exclude anything else long */
  WHEN LENGTH({$1}) > 11 THEN 0
                          /* YYYY-MMM/MM-DD */
                          WHEN REGEXP_LIKE(REGEXP_REPLACE(UPPER({$1}), '(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)', '12', 'g'),
                                '[12][09][0-9][0-9]-[0-1]?[0-9]-[0-3]?[0-9]')
                              THEN CASE
                                    WHEN CAST(SPLIT_PART({$1}, '-', 1) AS INTEGER) BETWEEN 1800 AND 2200
                                        AND (
                                              ( UPPER(SPLIT_PART({$1}, '-', 2)) IN ('01', '03', '05', '07', '08',
                                                                                  '1', '3', '5', '7', '8', '10', '12',
                                                                                  'JAN', 'MAR', 'MAY', 'JUL', 'AUG',
                                                                                  'OCT', 'DEC')
                                                AND CAST(SPLIT_PART({$1}, '-', 3) AS INTEGER) BETWEEN 1 AND 31 )
                                          OR  ( UPPER(SPLIT_PART({$1}, '-', 2)) IN ('04', '06', '09', '4', '6', '9', '11',
                                                                                  'APR', 'JUN', 'SEP', 'NOV')
                                                AND CAST(SPLIT_PART({$1}, '-', 3) AS INTEGER) BETWEEN 1 AND 30 )
                                          OR  ( UPPER(SPLIT_PART({$1}, '-', 2)) IN ('02', '2', 'FEB')
                                                AND CAST(SPLIT_PART({$1}, '-', 3) AS INTEGER) BETWEEN 1 AND 29)
                                            )
                                        THEN 1
                                      ELSE 0
  END
                          /* MM/-DD/-YY/YYYY */
  WHEN REGEXP_LIKE(REPLACE({$1}, '-', '/'), '^[0-1]?[0-9]/[0-3]?[0-9]/[12][09][0-9][0-9]$')
                            OR REGEXP_LIKE(REPLACE({$1}, '-', '/'), '^[0-1]?[0-9]/[0-3]?[0-9]/[0-9][0-9]$')
                              THEN
                                    CASE
                                      WHEN CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 1) AS INTEGER) BETWEEN 1 AND 12
                                      AND (
                                            ( CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 1) AS INTEGER) IN (1, 3, 5, 7, 8, 10, 12)
                                              AND CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 2) AS INTEGER) BETWEEN 1 AND 31 )
                                        OR  ( CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 1) AS INTEGER) IN (4, 6, 9, 11)
                                              AND CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 2) AS INTEGER) BETWEEN 1 AND 30 )
                                        OR  ( CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 1) AS INTEGER) = 2
                                              AND CAST(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 2) AS INTEGER) BETWEEN 1 AND 29)
                                          )
                                      AND
                                          CAST('20' || SUBSTRING(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 3), LENGTH(SPLIT_PART(REPLACE({$1}, '-', '/'), '/', 3)) - 1) AS INTEGER) BETWEEN 1800 AND 2200
                                      THEN 1
                                      ELSE 0
  END
                          /* DD-MMM-YYYY */
  WHEN REGEXP_LIKE(UPPER({$1}), '[0-3]?[0-9]-(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)-[12][09][0-9][0-9]')
                            THEN
                                CASE
                                  WHEN CAST(SPLIT_PART({$1}, '-', 3) AS INTEGER) BETWEEN 1800 AND 2200
                                      AND (
                                            ( UPPER(SPLIT_PART({$1}, '-', 2)) IN ('JAN', 'MAR', 'MAY', 'JUL', 'AUG', 'OCT', 'DEC')
                                              AND CAST(SPLIT_PART({$1}, '-', 1) AS INTEGER) BETWEEN 1 AND 31 )
                                        OR  ( UPPER(SPLIT_PART({$1}, '-', 2)) IN ('APR', 'JUN', 'SEP', 'NOV')
                                              AND CAST(SPLIT_PART({$1}, '-', 1) AS INTEGER) BETWEEN 1 AND 30 )
                                        OR  ( UPPER(SPLIT_PART({$1}, '-', 2)) = 'FEB'
                                              AND CAST(SPLIT_PART({$1}, '-', 1) AS INTEGER) BETWEEN 1 AND 29)
                                          )
                                    THEN 1
                                    ELSE 0
  END
  ELSE 0
  END
