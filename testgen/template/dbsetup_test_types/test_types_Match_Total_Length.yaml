test_types:
  id: '1545'
  test_type: Match_Total_Length
  test_name_short: Match Total Length
  test_name_long: Total text length equals baseline
  test_description: |-
    Tests that the combined length of all values in the column equals the baseline total.
  except_message: |-
    Total text length differs from baseline.
  measure_uom: Total length
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND value_ct > 0
    AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_sum
  default_parm_values: |-
    CAST(ROUND(COALESCE(avg_length, 0) * (value_ct - COALESCE(zero_length_ct, 0))) AS BIGINT)
  default_parm_prompts: |-
    Total Length at Baseline
  default_parm_help: |-
    The expected combined length in characters of all values in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected total length
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Total Length tests that the combined length of all values in the column is exactly the baseline total. A change points to values truncated, padded, trimmed or rewritten with a different length, including changes that leave the shortest and longest values as they were.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7060'
    test_type: Match_Total_Length
    sql_flavor: bigquery
    measure: |-
      SUM(LENGTH(CAST({COLUMN_NAME} AS STRING)))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_SUM}
  - id: '6060'
    test_type: Match_Total_Length
    sql_flavor: databricks
    measure: |-
      SUM(LEN({COLUMN_NAME}))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_SUM}
  - id: '3060'
    test_type: Match_Total_Length
    sql_flavor: mssql
    measure: |-
      SUM(CAST((LEN(CAST({COLUMN_VALUE} AS NVARCHAR(MAX)) + N'.') - 1) AS BIGINT))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_SUM}
  - id: '4060'
    test_type: Match_Total_Length
    sql_flavor: postgresql
    measure: |-
      SUM(LENGTH(CAST({COLUMN_NAME} AS TEXT)))
    test_operator: '<>'
    test_condition: |-
