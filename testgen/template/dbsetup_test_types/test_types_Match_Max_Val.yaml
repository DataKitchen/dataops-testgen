test_types:
  id: '1527'
  test_type: Match_Max_Val
  test_name_short: Match Maximum Value
  test_name_long: Maximum value equals baseline
  test_description: |-
    Tests that the highest value in the column equals the baseline maximum.
  except_message: |-
    Maximum value differs from baseline.
  measure_uom: Maximum value
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'N' AND value_ct > 0
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    max_value
  default_parm_prompts: |-
    Maximum Value at Baseline
  default_parm_help: |-
    The expected highest value in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [N]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected maximum value
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Maximum Value tests that the highest value in the column is exactly the baseline value, compared as a number.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7045'
    test_type: Match_Max_Val
    sql_flavor: bigquery
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS FLOAT64)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS FLOAT64)
  - id: '6045'
    test_type: Match_Max_Val
    sql_flavor: databricks
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS DOUBLE)
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS DOUBLE)
  - id: '3045'
    test_type: Match_Max_Val
    sql_flavor: mssql
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS FLOAT)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS FLOAT)
  - id: '4045'
    test_type: Match_Max_Val
    sql_flavor: postgresql
    measure: |-
      CAST(CAST(MAX({COLUMN_NUM}) AS VARCHAR) AS DOUBLE PRECISION)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS DOUBLE PRECISION)
  - id: '2025'
    test_type: Match_Max_Val
    sql_flavor: redshift
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS FLOAT8)
    test_operator: '<>'
    test_condition: |-
      CASE WHEN CAST(CAST(MAX({COLUMN_NAME}) AS REAL) AS FLOAT8) = CAST(MAX({COLUMN_NAME}) AS FLOAT8) THEN CAST(CAST({BASELINE_VALUE} AS REAL) AS FLOAT8) ELSE CAST({BASELINE_VALUE} AS FLOAT8) END
  - id: '7045'
    test_type: Match_Max_Val
    sql_flavor: redshift_spectrum
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS FLOAT8)
    test_operator: '<>'
    test_condition: |-
      CASE WHEN CAST(CAST(MAX({COLUMN_NAME}) AS REAL) AS FLOAT8) = CAST(MAX({COLUMN_NAME}) AS FLOAT8) THEN CAST(CAST({BASELINE_VALUE} AS REAL) AS FLOAT8) ELSE CAST({BASELINE_VALUE} AS FLOAT8) END
  - id: '2125'
    test_type: Match_Max_Val
    sql_flavor: snowflake
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS FLOAT)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS FLOAT)
  - id: '8045'
    test_type: Match_Max_Val
    sql_flavor: oracle
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS BINARY_DOUBLE)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS BINARY_DOUBLE)
  - id: '8045'
    test_type: Match_Max_Val
    sql_flavor: sap_hana
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS DOUBLE)
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS DOUBLE)
  - id: '10056'
    test_type: Match_Max_Val
    sql_flavor: salesforce_data360
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS DOUBLE PRECISION)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS DOUBLE PRECISION)
  - id: '11118'
    test_type: Match_Max_Val
    sql_flavor: duckdb
    measure: |-
      CAST(MAX({COLUMN_NAME}) AS DOUBLE)
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS DOUBLE)
  target_data_lookups:
