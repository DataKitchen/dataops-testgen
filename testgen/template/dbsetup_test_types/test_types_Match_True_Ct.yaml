test_types:
  id: '1535'
  test_type: Match_True_Ct
  test_name_short: Match True Count
  test_name_long: Count of true values equals baseline
  test_description: |-
    Tests that the number of true values in the column equals the baseline count.
  except_message: |-
    True value count differs from baseline.
  measure_uom: True values
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'B' AND value_ct > 0
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_ct
  default_parm_values: |-
    boolean_true_ct
  default_parm_prompts: |-
    True Count at Baseline
  default_parm_help: |-
    The expected number of true values in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected true value count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match True Count tests that the column holds exactly the baseline number of true values. With Match Null Count, it accounts for every value in a boolean column.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7053'
    test_type: Match_True_Ct
    sql_flavor: bigquery
    measure: |-
      SUM(CAST({COLUMN_NAME} AS INT64))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
