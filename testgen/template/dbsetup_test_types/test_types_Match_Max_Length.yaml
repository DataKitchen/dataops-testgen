test_types:
  id: '1537'
  test_type: Match_Max_Length
  test_name_short: Match Maximum Length
  test_name_long: Maximum text length equals baseline
  test_description: |-
    Tests that the length of the longest value in the column equals the baseline length.
  except_message: |-
    Maximum text length differs from baseline.
  measure_uom: Maximum length
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND value_ct > 0
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    max_length
  default_parm_prompts: |-
    Maximum Length at Baseline
  default_parm_help: |-
    The expected length in characters of the longest value in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected maximum length
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Maximum Length tests that the longest value in the column has exactly the baseline length. A drop points to truncation.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7055'
    test_type: Match_Max_Length
    sql_flavor: bigquery
    measure: |-
      MAX(LENGTH(CAST({COLUMN_NAME} AS STRING)))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE}
  - id: '6055'
    test_type: Match_Max_Length
    sql_flavor: databricks
    measure: |-
      MAX(LEN({COLUMN_NAME}))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE}
  - id: '3055'
    test_type: Match_Max_Length
    sql_flavor: mssql
    measure: |-
      MAX((LEN(CAST({COLUMN_VALUE} AS NVARCHAR(MAX)) + N'.') - 1))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE}
  - id: '4055'
    test_type: Match_Max_Length
    sql_flavor: postgresql
    measure: |-
      MAX(LENGTH(CAST({COLUMN_NAME} AS TEXT)))
    test_operator: '<>'
    test_condition: |-
