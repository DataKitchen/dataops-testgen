      COUNT(CASE WHEN REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE({COLUMN_NAME}, NCHAR(160), ''), NCHAR(8201), ''), NCHAR(8203), ''), NCHAR(8204), ''), NCHAR(8205), ''), NCHAR(8206), ''), NCHAR(8207), ''), NCHAR(8239), ''), NCHAR(12288), ''), NCHAR(65279), '') <> {COLUMN_NAME} THEN 1 END)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
  - id: '10070'
    test_type: Match_Non_Printing_Ct
    sql_flavor: salesforce_data360
    measure: |-
      SUM(CASE WHEN REGEXP_REPLACE({COLUMN_NAME}, '[' || CHR(160) || CHR(8201) || CHR(8203) || CHR(8204) || CHR(8205) || CHR(8206) || CHR(8207) || CHR(8239) || CHR(12288) || CHR(65279) || ']', 'X', 'g') <> {COLUMN_NAME} THEN 1 ELSE 0 END)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
  - id: '11146'
    test_type: Match_Non_Printing_Ct
    sql_flavor: duckdb
    measure: |-
      COUNT( CASE WHEN TRANSLATE({COLUMN_NAME}, chr(160) || chr(8201) || chr(8203) || chr(8204) || chr(8205) || chr(8206) || chr(8207) || chr(8239) || chr(12288) || chr(65279), 'XXXXXXXXXX') <> {COLUMN_NAME} THEN 1 END)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
