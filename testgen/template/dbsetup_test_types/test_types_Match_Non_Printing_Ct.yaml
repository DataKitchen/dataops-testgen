      COUNT(CASE WHEN TRANSLATE({COLUMN_NAME}, CHR(160) || CHR(8201) || CHR(8203) || CHR(8204) || CHR(8205) || CHR(8206) || CHR(8207) || CHR(8239) || CHR(12288) || CHR(65279), 'XXXXXXXXXX') <> {COLUMN_NAME} THEN 1 END)
