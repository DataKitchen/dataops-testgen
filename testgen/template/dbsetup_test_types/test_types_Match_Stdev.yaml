test_types:
  id: '1530'
  test_type: Match_Stdev
  test_name_short: Match Standard Deviation
  test_name_long: Standard deviation equals baseline within tolerance
  test_description: |-
    Tests that the standard deviation of the column equals the baseline, within a relative tolerance.
  except_message: |-
    Standard deviation differs from baseline by more than the tolerance.
  measure_uom: Standard deviation
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'N' AND value_ct > 1 AND distinct_value_ct > 1 AND stdev_value IS NOT NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_sd,upper_tolerance
  default_parm_values: |-
    stdev_value,0.000000001
  default_parm_prompts: |-
    Std Deviation at Baseline,Relative Tolerance
  default_parm_help: |-
    The expected sample standard deviation of the column values.|Allowed difference as a fraction of the baseline value. For example, 0.001 allows a difference of 0.1 percent.
  default_parm_required: Y,Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [N]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected standard deviation
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Standard Deviation tests that the sample standard deviation of the column is within a relative tolerance of the baseline. Together with Match Sum, it detects offsetting changes that leave the total unchanged. The default tolerance is close to an exact match; widen it per test when small numeric differences are expected.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7048'
    test_type: Match_Stdev
    sql_flavor: bigquery
    measure: |-
      STDDEV(CAST({COLUMN_NAME} AS FLOAT64))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SD} AS FLOAT64) - ABS(CAST({BASELINE_SD} AS FLOAT64) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SD} AS FLOAT64) + ABS(CAST({BASELINE_SD} AS FLOAT64) * {UPPER_TOLERANCE})
  - id: '6048'
    test_type: Match_Stdev
    sql_flavor: databricks
    measure: |-
      STDDEV_SAMP(CAST({COLUMN_NAME} AS DOUBLE))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SD} AS DOUBLE) - ABS(CAST({BASELINE_SD} AS DOUBLE) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SD} AS DOUBLE) + ABS(CAST({BASELINE_SD} AS DOUBLE) * {UPPER_TOLERANCE})
  - id: '3048'
    test_type: Match_Stdev
    sql_flavor: mssql
    measure: |-
      STDEV(CAST({COLUMN_NAME} AS FLOAT))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SD} AS FLOAT) - ABS(CAST({BASELINE_SD} AS FLOAT) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SD} AS FLOAT) + ABS(CAST({BASELINE_SD} AS FLOAT) * {UPPER_TOLERANCE})
  - id: '4048'
    test_type: Match_Stdev
    sql_flavor: postgresql
    measure: |-
      STDDEV(CAST({COLUMN_NAME}::NUMERIC AS FLOAT))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SD} AS DOUBLE PRECISION) - ABS(CAST({BASELINE_SD} AS DOUBLE PRECISION) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SD} AS DOUBLE PRECISION) + ABS(CAST({BASELINE_SD} AS DOUBLE PRECISION) * {UPPER_TOLERANCE})
