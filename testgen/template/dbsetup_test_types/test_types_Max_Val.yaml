test_types:
  id: '1517'
  test_type: Max_Val
  test_name_short: Maximum Value
  test_name_long: All values at or below set maximum
  test_description: |-
    Tests that maximum value present in column is no higher than maximum value in baseline data.
  except_message: |-
    Maximum column value greater than baseline.
  measure_uom: Values over limit
  measure_uom_description: null
  selection_criteria: null
  generation_template: null
  dq_score_prevalence_formula: |-
    ({RESULT_MEASURE}-{THRESHOLD_VALUE})::FLOAT/NULLIF({RECORD_CT}::FLOAT, 0)
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value,threshold_value
  default_parm_values: null
  default_parm_prompts: |-
    Maximum Value at Baseline,Threshold Error Count
  default_parm_help: null
  default_parm_required: Y,N
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [N]
  dq_dimension: Validity
  impact_dimension: Conformance
  health_dimension: Schema Drift
  threshold_description: |-
    Expected count of values over limit
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This test is appropriate for a cumulative dataset, assuming all prior values are still present. It is also appropriate for any measure that has an absolute, definable maximum value, or a heuristic that makes sense for valid data. For an exact maximum, use Match Maximum Value.
  active: Y
  ai_redact_values: false
  algorithm: Boundary check
  cat_test_conditions:
  - id: '7037'
    test_type: Max_Val
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} > {BASELINE_VALUE} + 1e-6 THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '6037'
