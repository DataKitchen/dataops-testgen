test_types:
  id: '1516'
  test_type: SQL_Metric
  test_name_short: SQL Metric
  test_name_long: Query result within set bounds
  test_description: |-
    Tests that the single value returned by the query falls within the set bounds.
  except_message: |-
    Query result outside expected bounds.
  measure_uom: Query result
  measure_uom_description: |-
    Value returned by the query
  selection_criteria: null
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: custom_query,lower_tolerance,upper_tolerance
  default_parm_values: null
  default_parm_prompts: |-
    Metric Query,Minimum Value,Maximum Value
  default_parm_help: |-
    Query should return a single numeric value: one row with one named column, for example `SELECT COUNT(*) AS late_orders FROM {DATA_SCHEMA}.orders WHERE shipped_date IS NULL`. A query can refer to any tables in the database. You must hard-code the schema or use `{DATA_SCHEMA}` to represent the schema defined for the Table Group.|The minimum acceptable query result. Leave blank for no minimum.|The maximum acceptable query result. Leave blank for no maximum.
  default_parm_required: Y,A,A
  default_severity: Fail
  run_type: QUERY
  test_scope: table
  dq_dimension: Accuracy
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected range for the query result
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This test runs a query you write and checks the single value it returns against a minimum, a maximum, or both. Use it for any metric that can be computed by a query, such as the number of orders awaiting shipment or the hours since the last load, when the acceptable range is known in advance. The query must return exactly one row with one numeric column. A query that returns more than one row or column, a value that is not numeric, or no value at all ends the test with an error rather than a failure, because it does not produce a metric to check. The query runs separately from other tests, so its performance depends largely on how efficiently it is written.
  active: Y
  ai_redact_values: true
  algorithm: Custom SQL
  cat_test_conditions: []
  target_data_lookups:
  - id: '1491'
    test_id: '1516'
    test_type: SQL_Metric
    sql_flavor: bigquery
    lookup_type: null
    lookup_query: |-
      SELECT q.*, {LOWER_TOLERANCE} AS lower_bound, {UPPER_TOLERANCE} AS upper_bound
      FROM (
        {CUSTOM_QUERY}
      ) q
      LIMIT {LIMIT}
    error_type: Test Results
