  test_templates:
  - id: '2518'
    test_type: SQL_Metric
    sql_flavor: bigquery
    template: |-
      SELECT '{TEST_TYPE}'   as test_type,
             '{TEST_DEFINITION_ID}' as test_definition_id,
             '{TEST_SUITE_ID}' as test_suite_id,
             '{TEST_RUN_ID}' as test_run_id,
             '{RUN_DATE}'    as test_time,
             '{SCHEMA_NAME}' as schema_name,
             '{TABLE_NAME}'  as table_name,
             '{COLUMN_NAME_NO_QUOTES}' as column_names,
             NULL as threshold_value,
             {SKIP_ERRORS} as skip_errors,
             '{INPUT_PARAMETERS}' as input_parameters,
             NULL as result_signal,
             CASE
               WHEN CAST(metric AS FLOAT64) IS NULL THEN NULL
               WHEN CAST(metric AS FLOAT64) < {LOWER_TOLERANCE} OR CAST(metric AS FLOAT64) > {UPPER_TOLERANCE} THEN 0
               ELSE 1
             END AS result_code,
             CASE
               WHEN CAST(metric AS FLOAT64) IS NULL THEN 'Query returned no numeric value.'
             END AS result_message,
             metric AS result_measure
        FROM ( SELECT MAX(metric) AS metric
                 FROM ( SELECT ( SELECT * FROM (
                 {CUSTOM_QUERY}
                 ) q ) AS metric ) s
             ) test
