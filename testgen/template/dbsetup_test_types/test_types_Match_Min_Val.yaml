  - id: '8044'
    test_type: Match_Min_Val
    sql_flavor: oracle
    measure: |-
      CAST(MIN({COLUMN_NAME}) AS BINARY_DOUBLE)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS BINARY_DOUBLE)
  - id: '8044'
    test_type: Match_Min_Val
    sql_flavor: sap_hana
    measure: |-
      CAST(MIN({COLUMN_NAME}) AS DOUBLE)
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS DOUBLE)
  - id: '10055'
    test_type: Match_Min_Val
    sql_flavor: salesforce_data360
    measure: |-
      CAST(MIN({COLUMN_NAME}) AS DOUBLE PRECISION)
    test_operator: '<>'
    test_condition: |-
      CAST({BASELINE_VALUE} AS DOUBLE PRECISION)
  - id: '11116'
    test_type: Match_Min_Val
    sql_flavor: duckdb
    measure: |-
