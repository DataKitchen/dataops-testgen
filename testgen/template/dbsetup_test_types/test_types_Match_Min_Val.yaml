      CASE WHEN CAST(CAST(MIN({COLUMN_NAME}) AS REAL) AS FLOAT8) = CAST(MIN({COLUMN_NAME}) AS FLOAT8) THEN CAST(CAST({BASELINE_VALUE} AS REAL) AS FLOAT8) ELSE CAST({BASELINE_VALUE} AS FLOAT8) END
  - id: '2124'
    test_type: Match_Min_Val
    sql_flavor: snowflake
    measure: |-
      CAST(MIN({COLUMN_NAME}) AS FLOAT)
    test_operator: '<>'
    test_condition: |-
