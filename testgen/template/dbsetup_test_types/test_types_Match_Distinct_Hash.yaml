test_types:
  id: '1542'
  test_type: Match_Distinct_Hash
  test_name_short: Match Distinct Hash
  test_name_long: Hash of distinct values equals baseline
  test_description: |-
    Tests that the set of distinct values in the column equals the baseline set, using a hash of the values.
  except_message: |-
    Set of distinct values differs from baseline.
  measure_uom: Matches baseline
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND distinct_value_hash IS NOT NULL
    AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    distinct_value_hash
  default_parm_prompts: |-
    Distinct Value Hash at Baseline
  default_parm_help: |-
    The MD5 hash, in lower-case hexadecimal, of the distinct non-null values in the column, sorted by their bytes and joined with the pipe character.
  default_parm_required: Y
  default_severity: Fail
  run_type: QUERY
  test_scope: column
  column_general_types: [A]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected distinct value hash
  result_visualization: binary_chart
  result_visualization_params: '{"legend":{"labels":{"0":"Differs","1":"Matches"}}}'
  usage_notes: |-
    Match Distinct Hash tests that the set of distinct values in the column is exactly the baseline set. Values are compared exactly, including case and spacing. A failure says the set changed, not how; Match Frequent Values shows which values differ.
  active: Y
  ai_redact_values: false
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
