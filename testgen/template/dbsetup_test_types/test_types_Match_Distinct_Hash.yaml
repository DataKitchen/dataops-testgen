  - id: '2221'
    test_type: Match_Distinct_Hash
    sql_flavor: mssql
    template: |-
      WITH hash_input AS (
        SELECT STRING_AGG(val, N'|') WITHIN GROUP (ORDER BY val, DATALENGTH(val)) AS agg
          FROM ( SELECT CAST(bin AS NVARCHAR(MAX)) COLLATE Latin1_General_100_BIN2 AS val
                   FROM ( SELECT DISTINCT TOP 71 CAST(LEFT(CAST({COLUMN_VALUE} AS NVARCHAR(MAX)), 71) AS VARBINARY(MAX)) AS bin
                            FROM {QUOTE}{SCHEMA_NAME}{QUOTE}.{QUOTE}{TABLE_NAME}{QUOTE}
                           WHERE {COLUMN_VALUE} IS NOT NULL ) distinct_bins ) distinct_vals
      ),
      hash_code_points AS (
        SELECT pos,
               CASE WHEN unit BETWEEN 55296 AND 56319 THEN 65536 + (unit - 55296) * 1024 + (next_unit - 56320)
                    ELSE unit END AS cp
          FROM ( SELECT p.pos, UNICODE(SUBSTRING(h.agg, p.pos, 1)) AS unit, UNICODE(SUBSTRING(h.agg, p.pos + 1, 1)) AS next_unit
                   FROM hash_input h
                  CROSS JOIN ( SELECT TOP (SELECT ISNULL(DATALENGTH(agg) / 2, 0) FROM hash_input)
                                      ROW_NUMBER() OVER (ORDER BY (SELECT NULL)) AS pos
                                 FROM sys.all_columns a CROSS JOIN sys.all_columns b ) p ) units
         WHERE unit NOT BETWEEN 56320 AND 57343
      ),
      hash_bytes AS (
        SELECT pos,
               CASE WHEN cp < 128 THEN CONVERT(VARCHAR(8), CAST(cp AS BINARY(1)), 2)
                    WHEN cp < 2048 THEN CONVERT(VARCHAR(8), CAST(192 + cp / 64 AS BINARY(1)) + CAST(128 + cp % 64 AS BINARY(1)), 2)
                    WHEN cp < 65536 THEN CONVERT(VARCHAR(8), CAST(224 + cp / 4096 AS BINARY(1)) + CAST(128 + cp / 64 % 64 AS BINARY(1))
                                                           + CAST(128 + cp % 64 AS BINARY(1)), 2)
                    ELSE CONVERT(VARCHAR(8), CAST(240 + cp / 262144 AS BINARY(1)) + CAST(128 + cp / 4096 % 64 AS BINARY(1))
                                           + CAST(128 + cp / 64 % 64 AS BINARY(1)) + CAST(128 + cp % 64 AS BINARY(1)), 2)
               END AS hex
          FROM hash_code_points
      ),
      test AS (
        SELECT CASE WHEN (SELECT agg FROM hash_input) IS NOT NULL
                    THEN LOWER(CONVERT(VARCHAR(32), HASHBYTES('MD5',
                             ISNULL(CONVERT(VARBINARY(MAX), STRING_AGG(CAST(hex AS VARCHAR(MAX)), '') WITHIN GROUP (ORDER BY pos), 2), 0x)), 2))
               END AS measure
          FROM hash_bytes
      )
      SELECT '{TEST_TYPE}'   as test_type,
             '{TEST_DEFINITION_ID}' as test_definition_id,
             '{TEST_SUITE_ID}' as test_suite_id,
             '{TEST_RUN_ID}' as test_run_id,
             '{RUN_DATE}'    as test_time,
             '{SCHEMA_NAME}' as schema_name,
             '{TABLE_NAME}'  as table_name,
             '{COLUMN_NAME_NO_QUOTES}' as column_names,
             NULL as threshold_value,
             {SKIP_ERRORS} as skip_errors,
             '{INPUT_PARAMETERS}' as input_parameters,
             LEFT(measure, 1000) as result_signal,
             CASE
               WHEN {BASELINE_VALUE_LITERAL} IS NULL THEN NULL
               WHEN measure IS NULL OR measure COLLATE Latin1_General_100_BIN2 <> {BASELINE_VALUE_LITERAL} COLLATE Latin1_General_100_BIN2 THEN 0
               ELSE 1
             END AS result_code,
             CASE
               WHEN {BASELINE_VALUE_LITERAL} IS NULL THEN 'Baseline is missing.'
               WHEN measure IS NULL OR measure COLLATE Latin1_General_100_BIN2 <> {BASELINE_VALUE_LITERAL} COLLATE Latin1_General_100_BIN2 THEN 'Set of distinct values differs from baseline.'
               ELSE 'Matches baseline.'
             END AS result_message,
             CASE
               WHEN {BASELINE_VALUE_LITERAL} IS NULL THEN NULL
               WHEN measure IS NULL OR measure COLLATE Latin1_General_100_BIN2 <> {BASELINE_VALUE_LITERAL} COLLATE Latin1_General_100_BIN2 THEN 0
               ELSE 1
             END AS result_measure
        FROM test
