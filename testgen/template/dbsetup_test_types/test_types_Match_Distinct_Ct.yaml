test_types:
  id: '1525'
  test_type: Match_Distinct_Ct
  test_name_short: Match Distinct Count
  test_name_long: Distinct value count equals baseline
  test_description: |-
    Tests that the number of distinct values in the column equals the baseline count.
  except_message: |-
    Distinct value count differs from baseline.
  measure_uom: Unique values
  measure_uom_description: null
  selection_criteria: |-
    record_ct > 0 AND general_type <> 'X'
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_unique_ct
  default_parm_values: |-
    distinct_value_ct
  default_parm_prompts: |-
    Distinct Value Count at Baseline
  default_parm_help: |-
    The expected number of distinct values in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected distinct value count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Distinct Count tests that the column holds exactly the baseline number of distinct values. For a count that is only expected not to drop, use Value Count.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7043'
    test_type: Match_Distinct_Ct
    sql_flavor: bigquery
    measure: |-
      COUNT(DISTINCT {COLUMN_NAME})
    test_operator: '<>'
    test_condition: |-
      {BASELINE_UNIQUE_CT}
