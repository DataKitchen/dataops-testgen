test_types:
  id: '1520'
  test_type: Required_No_Placeholder
  test_name_short: Required, No Placeholder
  test_name_long: Required non-null, non-placeholder value present
  test_description: |-
    Tests that the column contains no nulls and none of the set placeholder values, such as an empty string or N/A.
  except_message: |-
    Null or placeholder values found in column.
  measure_uom: Missing values
  measure_uom_description: null
  selection_criteria: |-
    record_ct = value_ct AND record_ct > 10 AND general_type = 'A' AND zero_length_ct = 0 AND filled_value_ct = 0 AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    ({RESULT_MEASURE}-{THRESHOLD_VALUE})::FLOAT/NULLIF({RECORD_CT}::FLOAT, 0)
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value,threshold_value
  default_parm_values: |-
    '"",blank,(blank),[blank],error,(error),[error],missing,(missing),[missing],tbd,(tbd),[tbd],n/a,(n/a),[n/a],#na,(#na),[#na],none,(none),[none],null,(null),[null],unknown,(unknown),[unknown],BLANK,(BLANK),[BLANK],ERROR,(ERROR),[ERROR],MISSING,(MISSING),[MISSING],TBD,(TBD),[TBD],N/A,(N/A),[N/A],#NA,(#NA),[#NA],NONE,(NONE),[NONE],NULL,(NULL),[NULL],UNKNOWN,(UNKNOWN),[UNKNOWN]',0
  default_parm_prompts: |-
    List of Placeholder Values,Threshold Missing Value Count
  default_parm_help: |-
    Comma-separated list of values that count as missing, matched exactly. Enclose a value in double quotes if it contains a comma, and use "" for the empty string.|The number of missing values that are acceptable before test fails.
  default_parm_required: Y,N
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [A]
  dq_dimension: Completeness
  impact_dimension: Conformance
  health_dimension: Schema Drift
  threshold_description: |-
    Expected count of missing values
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This test counts null values together with values that stand in for missing data, such as an empty string, N/A or Unknown. Each value in the list is matched exactly, so list every spelling the source system uses. Required Entry counts null values only.
  active: Y
  ai_redact_values: false
  algorithm: Set / lookup
  generation_sets:
    - Standard
    - Contract
  cat_test_conditions:
  - id: '7040'
    test_type: Required_No_Placeholder
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} IS NULL OR {COLUMN_NAME} IN ({BASELINE_VALUE_LIST}) THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '6040'
    test_type: Required_No_Placeholder
    sql_flavor: databricks
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} IS NULL OR {COLUMN_NAME} IN ({BASELINE_VALUE_LIST}) THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '3040'
    test_type: Required_No_Placeholder
    sql_flavor: mssql
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} IS NULL OR (CAST({COLUMN_VALUE} AS NVARCHAR(MAX)) COLLATE Latin1_General_100_BIN2 IN ({BASELINE_VALUE_LIST}) AND DATALENGTH({COLUMN_VALUE}) = DATALENGTH(RTRIM({COLUMN_VALUE}))) THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '4040'
    test_type: Required_No_Placeholder
