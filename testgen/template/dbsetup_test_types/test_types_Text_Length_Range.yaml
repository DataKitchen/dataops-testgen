test_types:
  id: '1519'
  test_type: Text_Length_Range
  test_name_short: Text Length Range
  test_name_long: All values within set length range
  test_description: |-
    Tests that the character length of every value in the column falls within the set minimum and maximum.
  except_message: |-
    Values found outside set length range.
  measure_uom: Values outside range
  measure_uom_description: null
  selection_criteria: null
  generation_template: null
  dq_score_prevalence_formula: |-
    ({RESULT_MEASURE}-{THRESHOLD_VALUE})::FLOAT/NULLIF({RECORD_CT}::FLOAT, 0)
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: lower_tolerance,upper_tolerance,threshold_value
  default_parm_values: null
  default_parm_prompts: |-
    Minimum Length,Maximum Length,Threshold Error Count
  default_parm_help: |-
    The minimum acceptable length of a value. Leave blank for no minimum.|The maximum acceptable length of a value. Leave blank for no maximum.|The number of errors that are acceptable before test fails.
  default_parm_required: A,A,N
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Validity
  impact_dimension: Conformance
  health_dimension: Schema Drift
  threshold_description: |-
    Expected count of values outside range
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This test counts values whose length in characters is shorter than the minimum or longer than the maximum. Either bound can be left blank to check one side only. Empty values have a length of zero, and null values are not counted.
  active: Y
  ai_redact_values: false
  algorithm: Boundary check
  cat_test_conditions:
  - id: '7039'
    test_type: Text_Length_Range
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN LENGTH(CAST({COLUMN_NAME} AS STRING)) < {LOWER_TOLERANCE} OR LENGTH(CAST({COLUMN_NAME} AS STRING)) > {UPPER_TOLERANCE} THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '6039'
    test_type: Text_Length_Range
    sql_flavor: databricks
    measure: |-
      SUM(CASE WHEN LEN({COLUMN_NAME}) < {LOWER_TOLERANCE} OR LEN({COLUMN_NAME}) > {UPPER_TOLERANCE} THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '3039'
    test_type: Text_Length_Range
    sql_flavor: mssql
    measure: |-
      SUM(CASE WHEN (LEN(CAST({COLUMN_NAME} AS NVARCHAR(MAX)) + N'.') - 1) < {LOWER_TOLERANCE} OR (LEN(CAST({COLUMN_NAME} AS NVARCHAR(MAX)) + N'.') - 1) > {UPPER_TOLERANCE} THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '4039'
