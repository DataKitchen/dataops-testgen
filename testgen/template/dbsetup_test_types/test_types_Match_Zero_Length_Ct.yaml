test_types:
  id: '1539'
  test_type: Match_Zero_Length_Ct
  test_name_short: Match Empty Strings
  test_name_long: Count of empty strings equals baseline
  test_description: |-
    Tests that the number of empty strings in the column equals the baseline count.
  except_message: |-
    Empty string count differs from baseline.
  measure_uom: Empty strings
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND value_ct > 0
    AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_ct
  default_parm_values: |-
    zero_length_ct
  default_parm_prompts: |-
    Empty String Count at Baseline
  default_parm_help: |-
    The expected number of empty strings in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [A]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected empty string count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Empty Strings tests that the column holds exactly the baseline number of empty strings. A drop alongside a rise in the null count points to empty strings converted to nulls.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7057'
    test_type: Match_Zero_Length_Ct
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} = '' THEN 1 ELSE 0 END)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
