test_types:
  id: '1521'
  test_type: Match_Row_Ct
  test_name_short: Match Row Count
  test_name_long: Row count equals baseline
  test_description: |-
    Tests that the number of rows in the table equals the baseline row count.
  except_message: |-
    Row count differs from baseline.
  measure_uom: Row count
  measure_uom_description: null
  selection_criteria: |-
    TEMPLATE
  generation_template: gen_Match_Row_Ct.sql
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: threshold_value
  default_parm_values: null
  default_parm_prompts: |-
    Row Count at Baseline
  default_parm_help: |-
    The expected number of rows in the table.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: table
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Volume
  threshold_description: |-
    Expected row count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Row Count tests that the table holds exactly the baseline number of rows. Use it to confirm that a copy or a reload has the same row count as its original, or that a reference table has not gained or lost rows. For a minimum rather than an exact count, use Row Count.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
