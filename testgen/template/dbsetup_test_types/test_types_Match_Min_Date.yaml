  - id: '10061'
    test_type: Match_Min_Date
    sql_flavor: salesforce_data360
    measure: |-
      SUBSTR(CAST(CAST(CASE WHEN MIN({COLUMN_NAME}) IS NULL THEN NULL ELSE GREATEST(MIN({COLUMN_NAME}), CAST('0001-01-01' AS TIMESTAMP)) END AS TIMESTAMP) AS VARCHAR), 1, 19)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE_LITERAL}
  - id: '11128'
    test_type: Match_Min_Date
    sql_flavor: duckdb
    measure: |-
      STRFTIME(CASE WHEN MIN({COLUMN_NAME}) IS NULL THEN NULL ELSE GREATEST(MIN({COLUMN_NAME})::TIMESTAMP, TIMESTAMP '0001-01-01') END, '%Y-%m-%d %H:%M:%S')
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE_LITERAL}
  target_data_lookups:
  - id: '1535'
    test_id: '1532'
    test_type: Match_Min_Date
    sql_flavor: bigquery
