      SELECT FORMAT_DATETIME('%Y-%m-%d %H:%M:%S', CAST(MIN(`{COLUMN_NAME}`) AS DATETIME)) AS current_min_date, {BASELINE_VALUE_LITERAL} AS baseline_min_date FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}`;
