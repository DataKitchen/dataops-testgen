test_types:
  id: '1543'
  test_type: Match_Frequent_Values
  test_name_short: Match Frequent Values
  test_name_long: Most frequent values and counts equal baseline
  test_description: |-
    Tests that the ten most frequent values in the column, and the count of each, equal the baseline.
  except_message: |-
    Most frequent values or their counts differ from baseline.
  measure_uom: Matches baseline
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND frequent_values IS NOT NULL
    AND LENGTH((SELECT STRING_AGG((entry ->> 'value') || ' (' || (entry ->> 'ct') || ')', ', ' ORDER BY rank)
       FROM JSONB_ARRAY_ELEMENTS(COALESCE(frequent_values -> 'values', '[]'::JSONB)) WITH ORDINALITY AS t(entry, rank))) <= 1000
    AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    (SELECT STRING_AGG((entry ->> 'value') || ' (' || (entry ->> 'ct') || ')', ', ' ORDER BY rank)
       FROM JSONB_ARRAY_ELEMENTS(COALESCE(frequent_values -> 'values', '[]'::JSONB)) WITH ORDINALITY AS t(entry, rank))
  default_parm_prompts: |-
    Frequent Values at Baseline
  default_parm_help: |-
    The ten most frequent values with their counts, most frequent first, written as value (count) and separated by a comma and a space, for example `Open (120), Closed (45)`. Values with equal counts are listed in byte order, and blank values are not counted.
  default_parm_required: Y
  default_severity: Fail
  run_type: QUERY
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected frequent values
  result_visualization: binary_chart
  result_visualization_params: '{"legend":{"labels":{"0":"Differs","1":"Matches"}}}'
  usage_notes: |-
    Match Frequent Values tests that the ten most frequent values in the column, and the count of each, are exactly the baseline. Blank values are not counted. It is the most direct test of how the distribution of a column has moved.
  active: Y
  ai_redact_values: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions: []
  target_data_lookups:
  - id: '1546'
    test_id: '1543'
    test_type: Match_Frequent_Values
    sql_flavor: bigquery
    lookup_type: null
    lookup_query: |-
      SELECT val AS frequent_value, ct AS count FROM ( SELECT `{COLUMN_NAME}` AS val, COUNT(*) AS ct, ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC, CAST(`{COLUMN_NAME}` AS BYTES)) AS rn FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}` WHERE `{COLUMN_NAME}` > ' ' GROUP BY `{COLUMN_NAME}` ) ranked WHERE rn <= 10 ORDER BY rn;
    error_type: Test Results
  - id: '1568'
