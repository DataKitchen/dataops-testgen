test_types:
  id: '1544'
  test_type: Match_Frequent_Patterns
  test_name_short: Match Frequent Patterns
  test_name_long: Most frequent patterns and counts equal baseline
  test_description: |-
    Tests that the five most frequent character patterns in the column, and the count of each, equal the baseline.
  except_message: |-
    Most frequent patterns or their counts differ from baseline.
  measure_uom: Matches baseline
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND frequent_patterns IS NOT NULL
    AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    (SELECT STRING_AGG((entry ->> 'value') || ' (' || (entry ->> 'ct') || ')', ', ' ORDER BY rank)
       FROM JSONB_ARRAY_ELEMENTS(COALESCE(frequent_patterns -> 'values', '[]'::JSONB)) WITH ORDINALITY AS t(entry, rank))
  default_parm_prompts: |-
    Frequent Patterns at Baseline
  default_parm_help: |-
    The five most frequent patterns with their counts, most frequent first, written as pattern (count) and separated by a comma and a space, for example `AA-NNNN (230), AA-NNN (12)`. A pattern replaces each lower-case letter with a, each upper-case letter with A and each digit with N.
  default_parm_required: Y
  default_severity: Fail
  run_type: QUERY
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected frequent patterns
  result_visualization: binary_chart
  result_visualization_params: '{"legend":{"labels":{"0":"Differs","1":"Matches"}}}'
  usage_notes: |-
    Match Frequent Patterns tests that the five most frequent character patterns in the column, and the count of each, are exactly the baseline. A pattern represents each value by its character classes, so a failure points to a change in the shape of values, such as a new format for codes.
  active: Y
  ai_redact_values: false
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions: []
  target_data_lookups:
  - id: '1547'
    test_id: '1544'
    test_type: Match_Frequent_Patterns
    sql_flavor: bigquery
    lookup_type: null
    lookup_query: |-
      SELECT val AS frequent_pattern, ct AS count FROM ( SELECT pattern AS val, COUNT(*) AS ct, ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC, CAST(pattern AS BYTES)) AS rn FROM ( SELECT REGEXP_REPLACE(REGEXP_REPLACE(REGEXP_REPLACE(CAST(`{COLUMN_NAME}` AS STRING), r'[a-z]', 'a'), r'[A-Z]', 'A'), r'[0-9]', 'N') AS pattern FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}` WHERE CAST(`{COLUMN_NAME}` AS STRING) > ' ' ) p GROUP BY pattern HAVING pattern > ' ' ) ranked WHERE rn <= 5 ORDER BY rn;
    error_type: Test Results
  - id: '1569'
    test_id: '1544'
    test_type: Match_Frequent_Patterns
