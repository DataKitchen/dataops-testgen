test_types:
  id: '1518'
  test_type: Max_Date
  test_name_short: Maximum Date
  test_name_long: All dates on or before set maximum
  test_description: |-
    Tests that latest date referenced in column is no later than baseline data.
  except_message: |-
    Latest date value found is after latest value at baseline.
  measure_uom: Dates after limit
  measure_uom_description: null
  selection_criteria: null
  generation_template: null
  dq_score_prevalence_formula: |-
    ({RESULT_MEASURE}-{THRESHOLD_VALUE})::FLOAT/NULLIF({RECORD_CT}::FLOAT, 0)
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value,threshold_value
  default_parm_values: null
  default_parm_prompts: |-
    Maximum Date at Baseline,Threshold Error Count
  default_parm_help: |-
    The latest date allowed. The comparison is exact, so on a timestamp column a date entered without a time means midnight at the start of that day, and later times on that day count as after it.|The number of dates after the maximum that the test allows.
  default_parm_required: Y,N
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [D, A]
  dq_dimension: Validity
  impact_dimension: Conformance
  health_dimension: Schema Drift
  threshold_description: |-
    Expected count of dates after maximum
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This test is appropriate where the latest date is a real ceiling, such as a closed historical range or a table that is no longer loaded. In a table that is still being added to, the latest date moves forward with every load, so a maximum taken from the baseline data fails on the next load. Use Recency to check that dates keep advancing, or Past Dates to check that no date is later than the test date. For an exact latest date, use Match Maximum Date.
  active: Y
  ai_redact_values: false
  algorithm: Boundary check
  cat_test_conditions:
  - id: '7038'
    test_type: Max_Date
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} > CAST(CAST('{BASELINE_VALUE}' AS DATETIME) AS {COLUMN_TYPE}) THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '6038'
