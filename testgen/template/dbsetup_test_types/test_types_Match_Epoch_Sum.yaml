test_types:
  id: '1549'
  test_type: Match_Epoch_Sum
  test_name_short: Match Epoch Sum
  test_name_long: Sum of epoch seconds equals baseline
  test_description: |-
    Tests that the sum of the column's dates, as seconds since 1970, equals the baseline sum.
  except_message: |-
    Sum of dates differs from baseline.
  measure_uom: Epoch seconds
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'D' AND epoch_sum IS NOT NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_sum
  default_parm_values: |-
    epoch_sum
  default_parm_prompts: |-
    Epoch Sum at Baseline
  default_parm_help: |-
    The expected sum of the column's non-null dates, each as whole seconds since 1970-01-01 UTC.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [D]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Baseline epoch sum
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Epoch Sum tests that the sum of the column's dates, as seconds since 1970, is exactly the baseline sum. A uniform time-zone shift moves the sum by the number of non-null values times the offset in seconds, so dividing the difference by that number reads the shift.
  active: Y
  ai_redact_values: true
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '11354'
    test_type: Match_Epoch_Sum
    sql_flavor: bigquery
    measure: |-
      SUM({EPOCH_SUM_TERM})
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_SUM}' AS BIGNUMERIC)
  - id: '11355'
    test_type: Match_Epoch_Sum
    sql_flavor: databricks
    measure: |-
      SUM({EPOCH_SUM_TERM})
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_SUM}' AS DECIMAL(38,0))
