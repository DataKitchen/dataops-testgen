test_types:
  id: '1538'
  test_type: Match_Lead_Space_Ct
  test_name_short: Match Leading Spaces
  test_name_long: Count of values with leading spaces equals baseline
  test_description: |-
    Tests that the number of values with leading spaces equals the baseline count.
  except_message: |-
    Count of values with leading spaces differs from baseline.
  measure_uom: Values with leading spaces
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND value_ct > 0
    AND sample_ratio IS NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_ct
  default_parm_values: |-
    lead_space_ct
  default_parm_prompts: |-
    Leading Space Count at Baseline
  default_parm_help: |-
    The expected number of values that begin with a space.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected leading space count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Leading Spaces tests that exactly the baseline number of values begin with a space. A drop points to values trimmed during a load.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7056'
    test_type: Match_Lead_Space_Ct
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN ({COLUMN_NAME} LIKE ' %' AND LTRIM({COLUMN_NAME}) <> '') THEN 1 ELSE 0 END)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
