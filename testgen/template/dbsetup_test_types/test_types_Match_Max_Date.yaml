test_types:
  id: '1533'
  test_type: Match_Max_Date
  test_name_short: Match Maximum Date
  test_name_long: Latest date equals baseline
  test_description: |-
    Tests that the latest date in the column equals the baseline date, compared to the second.
  except_message: |-
    Latest date differs from baseline.
  measure_uom: Latest date
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'D' AND value_ct > 0
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    TO_CHAR(max_date, 'YYYY-MM-DD HH24:MI:SS')
  default_parm_prompts: |-
    Latest Date at Baseline
  default_parm_help: |-
    The expected latest date in the column, in the form YYYY-MM-DD HH:MM:SS.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [D, A]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected latest date
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Maximum Date tests that the latest date in the column is exactly the baseline date. Dates are compared to the second, and fractional seconds are ignored.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7051'
    test_type: Match_Max_Date
    sql_flavor: bigquery
    measure: |-
      FORMAT_DATETIME('%Y-%m-%d %H:%M:%S', CAST(MAX({COLUMN_NAME}) AS DATETIME))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE_LITERAL}
  - id: '6051'
    test_type: Match_Max_Date
    sql_flavor: databricks
    measure: |-
      DATE_FORMAT(MAX({COLUMN_NAME}), 'yyyy-MM-dd HH:mm:ss')
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE_LITERAL}
  - id: '3051'
    test_type: Match_Max_Date
    sql_flavor: mssql
    measure: |-
      CONVERT(VARCHAR(19), CAST(MAX({COLUMN_NAME}) AS DATETIME2), 120)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE_LITERAL}
  - id: '4051'
    test_type: Match_Max_Date
    sql_flavor: postgresql
    measure: |-
      TO_CHAR(CAST(MAX({COLUMN_NAME}) AS TIMESTAMP), 'YYYY-MM-DD HH24:MI:SS')
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE_LITERAL}
  - id: '2031'
