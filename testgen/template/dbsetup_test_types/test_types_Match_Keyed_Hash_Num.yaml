test_types:
  id: '1551'
  test_type: Match_Keyed_Hash_Num
  test_name_short: Match Keyed Numeric Hash
  test_name_long: Keyed hash sum of numeric values equals baseline
  test_description: |-
    Tests that each numeric value in the column is attached to the same row as at baseline, by comparing a sum of hashes of each row's key and value.
  except_message: |-
    Numeric values are not attached to the same rows as at baseline.
  measure_uom: Keyed hash sum
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'N' AND keyed_hash IS NOT NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value,groupby_names
  default_parm_values: |-
    keyed_hash,key_column_name
  default_parm_prompts: |-
    Keyed Hash Sum at Baseline,Key Column
  default_parm_help: |-
    The expected sum of the hashes of each row's key and numeric value.|The column that identifies each row of the table, named without quotes.
  default_parm_required: Y,Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [N]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Baseline keyed hash sum
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Keyed Numeric Hash tests that each value in the column is attached to the same row as at baseline, by comparing a sum of hashes of each row's key and value. It detects values moved between rows, which leaves every column-level count, sum, and unkeyed hash unchanged. The key column is named in the test. If the key itself was regenerated, as a surrogate key often is when a table is reloaded, every keyed hash test on the table fails while the unkeyed hash tests pass; that means the key changed, not the values.
  active: Y
  ai_redact_values: true
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '11390'
    test_type: Match_Keyed_Hash_Num
    sql_flavor: bigquery
    measure: |-
      SUM({KEYED_HASH_TERM})
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS BIGNUMERIC)
  - id: '11391'
    test_type: Match_Keyed_Hash_Num
    sql_flavor: databricks
    measure: |-
