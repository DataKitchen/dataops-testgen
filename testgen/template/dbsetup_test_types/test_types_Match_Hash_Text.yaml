test_types:
  id: '1546'
  test_type: Match_Hash_Text
  test_name_short: Match Text Hash
  test_name_long: Hash sum of text values equals baseline
  test_description: |-
    Tests that the text values in the column, and how often each occurs, equal the baseline, by comparing a sum of per-value hashes.
  except_message: |-
    Text values differ from baseline.
  measure_uom: Hash sum
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND multiset_hash IS NOT NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    multiset_hash
  default_parm_prompts: |-
    Hash Sum at Baseline
  default_parm_help: |-
    The expected sum of the hashes of the column's non-null text values.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [A]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Baseline hash sum
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Text Hash tests that the text values in the column, including how often each occurs, are exactly the baseline, by comparing a sum of per-value hashes. It detects nearly any change to the values, independent of row order. A failure says the values differ, not how; the column's counts, lengths and frequent values show what changed.
  active: Y
  ai_redact_values: true
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '11300'
    test_type: Match_Hash_Text
    sql_flavor: bigquery
    measure: |-
      SUM({MULTISET_HASH_TERM})
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS BIGNUMERIC)
  - id: '11301'
    test_type: Match_Hash_Text
    sql_flavor: databricks
    measure: |-
      SUM({MULTISET_HASH_TERM})
    test_operator: '<>'
    test_condition: |-
      CAST('{BASELINE_VALUE}' AS DECIMAL(38,0))
