test_types:
  id: '1701'
  test_type: Valid_US_CA_Zip
  test_name_short: Valid US/Canada Zip
  test_name_long: Valid USA or Canadian Postal Codes
  test_description: |-
    Tests that postal codes match the 5-digit or 9-digit standard US formats or the 6-character standard Canadian format.
  except_message: |-
    Invalid US zip code or Canadian postal code formats found.
  measure_uom: Invalid postal codes
  measure_uom_description: |-
    Expected count of values with invalid postal codes
  selection_criteria: |-
    functional_data_type = 'Zip US/CA'
  generation_template: null
  dq_score_prevalence_formula: |-
    ({RESULT_MEASURE}-{THRESHOLD_VALUE})::FLOAT/NULLIF({RECORD_CT}::FLOAT, 0)
  dq_score_risk_factor: '0.75'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: threshold_value
  default_parm_values: |-
    0
  default_parm_prompts: |-
    Threshold Invalid Value Count
  default_parm_help: null
  default_parm_required: N
  default_severity: Warning
  run_type: CAT
  test_scope: column
  column_general_types: [A]
  dq_dimension: Validity
  impact_dimension: Conformance
  health_dimension: Schema Drift
  threshold_description: |-
    Expected count of invalid postal codes
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This test looks for the presence of values that fail to match either a US zip code (five digits, nine digits, or five digits, a hyphen and four digits) or a Canadian postal code (letter, digit, letter, an optional space, then digit, letter, digit). Letters may be uppercase or lowercase. Use this test in place of Valid US Zip when a column holds addresses from both countries. The test checks the format only, not whether the code has been assigned.
  active: Y
  ai_redact_values: false
  algorithm: Pattern / regex
  generation_sets:
    - Standard
  cat_test_conditions:
  - id: '11426'
    test_type: Valid_US_CA_Zip
    sql_flavor: bigquery
    measure: |-
      SUM(CASE WHEN REGEXP_REPLACE(REGEXP_REPLACE({COLUMN_NAME}, r'[0-9]', '9'), r'[A-Za-z]', 'A') NOT IN ('99999', '999999999', '99999-9999', 'A9A 9A9', 'A9A9A9') THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
  - id: '11427'
    test_type: Valid_US_CA_Zip
    sql_flavor: databricks
    measure: |-
      SUM(CASE WHEN TRANSLATE({COLUMN_NAME},'012345678ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz','999999999AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA') NOT IN ('99999', '999999999', '99999-9999', 'A9A 9A9', 'A9A9A9') THEN 1 ELSE 0 END)
    test_operator: '>'
    test_condition: |-
