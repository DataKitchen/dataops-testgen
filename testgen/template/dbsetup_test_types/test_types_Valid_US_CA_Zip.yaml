      SELECT `{COLUMN_NAME}`, COUNT(*) AS record_ct
      FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}`
      WHERE REGEXP_REPLACE(REGEXP_REPLACE(CAST(`{COLUMN_NAME}` AS STRING), r'[0-9]', '9'), r'[A-Za-z]', 'A') NOT IN ('99999', '999999999', '99999-9999', 'A9A 9A9', 'A9A9A9')
