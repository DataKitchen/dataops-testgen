test_types:
  id: '1531'
  test_type: Match_Fractional_Sum
  test_name_short: Match Fractional Sum
  test_name_long: Sum of fractional parts equals baseline
  test_description: |-
    Tests that the sum of the fractional parts of the column values equals the baseline sum.
  except_message: |-
    Sum of fractional parts differs from baseline.
  measure_uom: Fractional sum
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'N' AND fractional_sum IS NOT NULL
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_sum
  default_parm_values: |-
    fractional_sum
  default_parm_prompts: |-
    Fractional Sum at Baseline
  default_parm_help: |-
    The expected sum of the fractional parts of the column values. Each fractional part is rounded to five decimal places before it is added.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  column_general_types: [N]
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected fractional sum
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Fractional Sum tests that the sum of the fractional parts of the column values is exactly the baseline sum. A drop points to values rounded or truncated to fewer decimal places. For a floor rather than an exact sum, use Decimal Truncation.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7049'
    test_type: Match_Fractional_Sum
    sql_flavor: bigquery
    measure: |-
      SUM(CAST(COALESCE(ROUND(ROUND(CAST(ABS(MOD({COLUMN_NAME}, 1)) AS NUMERIC), 8), 5), 0) AS BIGNUMERIC))
    test_operator: '<>'
    test_condition: |-
      ROUND({BASELINE_SUM}, 5)
  - id: '6049'
    test_type: Match_Fractional_Sum
    sql_flavor: databricks
    measure: |-
      SUM(CAST(ROUND(CAST(ABS(MOD({COLUMN_NAME}, 1)) AS DECIMAL(38,8)), 5) AS DECIMAL(38,5)))
    test_operator: '<>'
    test_condition: |-
      ROUND({BASELINE_SUM}, 5)
  - id: '3049'
    test_type: Match_Fractional_Sum
    sql_flavor: mssql
    measure: |-
      SUM(CAST(ROUND(CAST(ABS(({COLUMN_NAME} % 1)) AS DECIMAL(38,8)), 5) AS DECIMAL(38,5)))
    test_operator: '<>'
    test_condition: |-
      ROUND({BASELINE_SUM}, 5)
