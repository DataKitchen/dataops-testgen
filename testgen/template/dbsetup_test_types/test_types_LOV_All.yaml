  target_data_lookups:
  - id: '1376'
    test_id: '1018'
    test_type: LOV_All
    sql_flavor: bigquery
    lookup_type: null
    lookup_query: |-
      SELECT listed_value AS `{COLUMN_NAME}`, mismatch_ct AS count FROM (
        SELECT MIN({VALUE_LIST_VALUE}) AS listed_value, COUNT(*) AS mismatch_ct
        FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}`
        WHERE {VALUE_LIST_COLUMN} NOT IN ({VALUE_LIST_LITERALS}) {SUBSET_AND}
        GROUP BY {VALUE_LIST_DISTINCT}
        UNION ALL
        SELECT expected.expected_value, 0
        FROM ({VALUE_LIST_ROWS}) expected
        LEFT JOIN (SELECT DISTINCT {VALUE_LIST_DISTINCT} AS value_key FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}` {SUBSET_WHERE}) found
          ON found.value_key = expected.value_key
        WHERE found.value_key IS NULL
      ) mismatches
      LIMIT {LIMIT};
    error_type: Test Results
