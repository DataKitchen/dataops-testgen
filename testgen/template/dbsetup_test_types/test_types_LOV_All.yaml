test_types:
  id: '1018'
  test_type: LOV_All
  test_name_short: Value Match All
  test_name_long: List of expected values all present in column
  test_description: |-
    Tests that every column value is in the list of expected values and that every expected value appears at least once.
  except_message: |-
    Column values do not exactly match expected list of values.
  measure_uom: Mismatched values
  measure_uom_description: null
  selection_criteria: null
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value,threshold_value,subset_condition
  default_parm_values: null
  default_parm_prompts: |-
    List of Expected Values,Threshold Mismatch Count,Record Subset Condition
  default_parm_help: |-
    Comma-separated list of every value expected in the column, in any order, matched exactly. Enclose a value in double quotes if it contains a comma, and use "" for the empty string.|The number of mismatched values that are acceptable before the test fails.|Condition selecting the records to test, written like a SQL WHERE clause. Example: status = 'SHIPPED'.
  default_parm_required: Y,N,N
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Validity
  impact_dimension: Conformance
  health_dimension: Schema Drift
  threshold_description: |-
    Number of values that do not match the expected list
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    This is a more restrictive form of Value Match: every value in the column must be in the list, and every value in the list must appear at least once. Numbers are compared by value, and text is case-sensitive.
  active: Y
  ai_redact_values: true
  algorithm: Set / lookup
  cat_test_conditions:
  - id: '7013'
    test_type: LOV_All
    sql_flavor: bigquery
    measure: |-
      COUNT(DISTINCT CASE WHEN {VALUE_LIST_COLUMN} NOT IN ({VALUE_LIST_LITERALS}) THEN {VALUE_LIST_DISTINCT} END) + {VALUE_LIST_CT} - COUNT(DISTINCT CASE WHEN {VALUE_LIST_COLUMN} IN ({VALUE_LIST_LITERALS}) THEN {VALUE_LIST_DISTINCT} END)
    test_operator: '>'
    test_condition: |-
      {THRESHOLD_VALUE}
