test_types:
  id: '1524'
  test_type: Match_Null_Ct
  test_name_short: Match Null Count
  test_name_long: Null count equals baseline
  test_description: |-
    Tests that the number of null values in the column equals the baseline count.
  except_message: |-
    Null count differs from baseline.
  measure_uom: Null values
  measure_uom_description: null
  selection_criteria: |-
    record_ct > 0 AND NOT (general_type = 'X' AND query_error IS NOT NULL)
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_ct
  default_parm_values: |-
    null_value_ct
  default_parm_prompts: |-
    Null Count at Baseline
  default_parm_help: |-
    The expected number of null values in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected null count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Null Count tests that the column holds exactly the baseline number of nulls. A change points to values lost or filled in during a load.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7042'
    test_type: Match_Null_Ct
    sql_flavor: bigquery
    measure: |-
      SUM(IF({COLUMN_NAME} IS NULL, 1, 0))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
  - id: '6042'
    test_type: Match_Null_Ct
    sql_flavor: databricks
    measure: |-
      SUM(CASE WHEN {COLUMN_NAME} IS NULL THEN 1 ELSE 0 END)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
