  - id: '3054'
    test_type: Match_Min_Length
    sql_flavor: mssql
    measure: |-
      MIN((LEN(CAST({COLUMN_VALUE} AS NVARCHAR(MAX)) + N'.') - 1))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE}
  - id: '4054'
