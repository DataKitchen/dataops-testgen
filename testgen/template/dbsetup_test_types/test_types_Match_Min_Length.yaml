test_types:
  id: '1536'
  test_type: Match_Min_Length
  test_name_short: Match Minimum Length
  test_name_long: Minimum text length equals baseline
  test_description: |-
    Tests that the length of the shortest value in the column equals the baseline length.
  except_message: |-
    Minimum text length differs from baseline.
  measure_uom: Minimum length
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'A' AND value_ct > 0
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_value
  default_parm_values: |-
    min_length
  default_parm_prompts: |-
    Minimum Length at Baseline
  default_parm_help: |-
    The expected length in characters of the shortest value in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected minimum length
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Minimum Length tests that the shortest value in the column has exactly the baseline length.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7054'
    test_type: Match_Min_Length
    sql_flavor: bigquery
    measure: |-
      MIN(LENGTH(CAST({COLUMN_NAME} AS STRING)))
    test_operator: '<>'
    test_condition: |-
      {BASELINE_VALUE}
  - id: '6054'
    test_type: Match_Min_Length
    sql_flavor: databricks
    measure: |-
      MIN(LEN({COLUMN_NAME}))
    test_operator: '<>'
    test_condition: |-
