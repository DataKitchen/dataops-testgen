test_types:
  id: '1528'
  test_type: Match_Zero_Ct
  test_name_short: Match Zero Count
  test_name_long: Count of zero values equals baseline
  test_description: |-
    Tests that the number of zero values in the column equals the baseline count.
  except_message: |-
    Zero value count differs from baseline.
  measure_uom: Zero values
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'N' AND value_ct > 0
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_ct
  default_parm_values: |-
    zero_value_ct
  default_parm_prompts: |-
    Zero Value Count at Baseline
  default_parm_help: |-
    The expected number of zero values in the column.
  default_parm_required: Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected zero value count
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Zero Count tests that the column holds exactly the baseline number of zeros. A rise alongside a drop in the null count points to nulls replaced by zeros.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7046'
    test_type: Match_Zero_Ct
    sql_flavor: bigquery
    measure: |-
      CAST(SUM(1 - ABS(SIGN(CAST({COLUMN_NAME} AS NUMERIC)))) AS INT64)
    test_operator: '<>'
    test_condition: |-
      {BASELINE_CT}
  - id: '6046'
    test_type: Match_Zero_Ct
