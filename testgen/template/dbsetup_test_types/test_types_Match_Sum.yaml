    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SUM} AS DOUBLE PRECISION) - COUNT({COLUMN_NAME}) * 0.000000005 - ABS(CAST({BASELINE_SUM} AS DOUBLE PRECISION) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SUM} AS DOUBLE PRECISION) + COUNT({COLUMN_NAME}) * 0.000000005 + ABS(CAST({BASELINE_SUM} AS DOUBLE PRECISION) * {UPPER_TOLERANCE})
