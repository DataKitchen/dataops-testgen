test_types:
  id: '1529'
  test_type: Match_Sum
  test_name_short: Match Sum
  test_name_long: Sum of values equals baseline within tolerance
  test_description: |-
    Tests that the column total equals the baseline total, within a relative tolerance.
  except_message: |-
    Column sum differs from baseline by more than the tolerance.
  measure_uom: Column sum
  measure_uom_description: null
  selection_criteria: |-
    general_type = 'N' AND value_ct > 0 AND GREATEST(ABS(min_value), ABS(max_value)) * value_ct < 1e30
    AND ABS(avg_value) >= 1e-5 * GREATEST(ABS(min_value), ABS(max_value))
  generation_template: null
  dq_score_prevalence_formula: |-
    1
  dq_score_risk_factor: '1.0'
  column_name_prompt: null
  column_name_help: null
  default_parm_columns: baseline_sum,upper_tolerance
  default_parm_values: |-
    avg_value * value_ct,0.000000001
  default_parm_prompts: |-
    Sum at Baseline,Relative Tolerance
  default_parm_help: |-
    The expected total of the column values.|Allowed difference as a fraction of the baseline value. For example, 0.001 allows a difference of 0.1 percent.
  default_parm_required: Y,Y
  default_severity: Fail
  run_type: CAT
  test_scope: column
  dq_dimension: Consistency
  impact_dimension: Conformance
  health_dimension: Data Drift
  threshold_description: |-
    Expected column sum
  result_visualization: line_chart
  result_visualization_params: null
  usage_notes: |-
    Match Sum tests that the column total is within a relative tolerance of the baseline total. The default tolerance is close to an exact match; widen it per test when small numeric differences are expected.
  active: Y
  ai_redact_values: false
  null_measure_fails: true
  algorithm: Aggregate reconciliation
  generation_sets:
    - Table Comparison
  cat_test_conditions:
  - id: '7047'
    test_type: Match_Sum
    sql_flavor: bigquery
    measure: |-
      SUM(CAST({COLUMN_NAME} AS BIGNUMERIC))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SUM} AS FLOAT64) - ABS(CAST({BASELINE_SUM} AS FLOAT64) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SUM} AS FLOAT64) + ABS(CAST({BASELINE_SUM} AS FLOAT64) * {UPPER_TOLERANCE})
  - id: '6047'
    test_type: Match_Sum
    sql_flavor: databricks
    measure: |-
      SUM(CAST({COLUMN_NAME} AS DECIMAL(38,8)))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SUM} AS DOUBLE) - COUNT({COLUMN_NAME}) * 0.000000005 - ABS(CAST({BASELINE_SUM} AS DOUBLE) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SUM} AS DOUBLE) + COUNT({COLUMN_NAME}) * 0.000000005 + ABS(CAST({BASELINE_SUM} AS DOUBLE) * {UPPER_TOLERANCE})
  - id: '3047'
    test_type: Match_Sum
    sql_flavor: mssql
    measure: |-
      SUM(CAST({COLUMN_NAME} AS DECIMAL(38,8)))
    test_operator: NOT BETWEEN
    test_condition: |-
      CAST({BASELINE_SUM} AS FLOAT) - COUNT({COLUMN_NAME}) * 0.000000005 - ABS(CAST({BASELINE_SUM} AS FLOAT) * {UPPER_TOLERANCE}) AND CAST({BASELINE_SUM} AS FLOAT) + COUNT({COLUMN_NAME}) * 0.000000005 + ABS(CAST({BASELINE_SUM} AS FLOAT) * {UPPER_TOLERANCE})
  - id: '4047'
    test_type: Match_Sum
    sql_flavor: postgresql
