profile_anomaly_types:
  id: '1015'
  anomaly_type: Boolean_Value_Mismatch
  data_object: Column
  anomaly_name: Unexpected Boolean Values Found
  anomaly_description: "This column appears to contain boolean (True/False) data,\
    \ but unexpected values were found. This could indicate inconsistent coding for\
    \ the same intended values, potentially leading to downstream errors or inconsistent\
    \ business logic.  "
  anomaly_criteria: |-
    distinct_value_ct > 1
       AND ( (    (fn_frequent_value(p.frequent_values, 1) ILIKE 'true' OR fn_frequent_value(p.frequent_values, 1) ILIKE 'false')
              AND NOT (fn_frequent_has(p.frequent_values, 'true') AND fn_frequent_has(p.frequent_values, 'false')) )
          OR (    (fn_frequent_value(p.frequent_values, 1) ILIKE 'yes' OR fn_frequent_value(p.frequent_values, 1) ILIKE 'no')
              AND NOT (fn_frequent_has(p.frequent_values, 'yes') AND fn_frequent_has(p.frequent_values, 'no')) ) )
  detail_expression: |-
    CASE WHEN p.frequent_values IS NULL THEN 'Min: ' || p.min_text || ', Max: ' || p.max_text
                ELSE 'Top Freq: ' || fn_frequent_display(p.frequent_values) END
  detail_redactable: true
  issue_likelihood: Likely
  suggested_action: "Review your source data and follow-up with data owners to determine\
    \ whether this data needs to be corrected. "
  dq_score_prevalence_formula: null
  dq_score_risk_factor: '0.66'
  dq_dimension: Validity
  impact_dimension: Usability
  target_data_lookups:
  - id: '1353'
    test_id: '1015'
    test_type: Boolean_Value_Mismatch
    sql_flavor: bigquery
    lookup_type: null
    lookup_query: |-
      SELECT DISTINCT `{COLUMN_NAME}`, COUNT(*) AS count
      FROM `{TARGET_SCHEMA}`.`{TABLE_NAME}`
      GROUP BY `{COLUMN_NAME}`
      ORDER BY COUNT(*) DESC
      LIMIT {LIMIT};
    error_type: Profile Anomaly
  - id: '1287'
