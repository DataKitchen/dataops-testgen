# Default values for testgen-services.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: "postgres"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

secret:
  create: true
  name: services-secret

postgres:
  replicaCount: 1

  service:
    type: ClusterIP
    port: 5432

  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "14.1-alpine"

  imagePullSecrets: []

  auth:
    user: postgres
    database: datakitchen
    passwordKey: postgres-password

  storage:
    size: 1Gi
    storageClass: ""

  # Sized for evaluation clusters. Production installs point TestGen at a PostgreSQL server
  # outside the cluster.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 4Gi
