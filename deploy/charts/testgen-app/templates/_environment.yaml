{{- define "testgen.environment" -}}
{{- $sslMode := .Values.testgen.databaseSslMode | default "" | lower }}
{{- $sslRootCert := .Values.testgen.databaseSslRootCert | default "system" }}
{{- if and (not $sslMode) (ne $sslRootCert "system") }}
{{- fail "testgen.databaseSslRootCert is set but testgen.databaseSslMode is empty, so the certificate would never be used. Set databaseSslMode to verify-full, or to verify-ca to verify the authority without the host name." }}
{{- end }}
{{- if and (eq $sslMode "verify-ca") (eq $sslRootCert "system") }}
{{- fail "testgen.databaseSslMode is verify-ca, which needs a certificate authority, and testgen.databaseSslRootCert is system, which libpq takes only alongside verify-full. Set databaseSslMode to verify-full, or point databaseSslRootCert at a PEM bundle mounted through extraVolumes." }}
{{- end }}
- name: TG_DECRYPT_SALT
  valueFrom:
    secretKeyRef:
      name: {{ .Values.testgen.authSecrets.name | quote }}
      key: "decrypt-salt"
- name: TG_DECRYPT_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.testgen.authSecrets.name | quote }}
      key: "decrypt-password"
- name: TG_JWT_HASHING_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.testgen.authSecrets.name | quote }}
      key: "jwt-hashing-key"
- name: TG_METADATA_DB_HOST
  value: {{ .Values.testgen.databaseHost | quote }}
- name: TG_METADATA_DB_PORT
  value: {{ .Values.testgen.databasePort | quote }}
- name: TG_METADATA_DB_NAME
  value: {{ .Values.testgen.databaseName | quote }}
- name: TG_METADATA_DB_SCHEMA
  value: {{ .Values.testgen.databaseSchema | quote }}
- name: TG_METADATA_DB_USER
  value: {{ .Values.testgen.databaseUser | quote }}
- name: TG_METADATA_DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.testgen.databasePasswordSecret.name | quote }}
      key: {{ .Values.testgen.databasePasswordSecret.key | quote }}
{{- if .Values.testgen.databaseSslMode }}
- name: TG_METADATA_DB_SSLMODE
  value: {{ .Values.testgen.databaseSslMode | quote }}
- name: TG_METADATA_DB_SSLROOTCERT
  value: {{ .Values.testgen.databaseSslRootCert | quote }}
{{- end }}
- name: TG_TARGET_DB_TRUST_SERVER_CERTIFICATE
  value: {{ .Values.testgen.trustTargetDatabaseCertificate | ternary "yes" "no" | quote }}
- name: TG_EXPORT_TO_OBSERVABILITY_VERIFY_SSL
  value: {{ .Values.testgen.observabilityVerifySsl | ternary "yes" "no" | quote }}
{{- with .Values.testgen.emailNotifications }}
{{- if .smtp.endpoint }}
- name: TG_SMTP_ENDPOINT
  value: {{ .smtp.endpoint | quote }}
{{- end }}
{{- if .smtp.port }}
- name: TG_SMTP_PORT
  value: {{ .smtp.port | quote }}
{{- end }}
{{- if .smtp.username }}
- name: TG_SMTP_USERNAME
  value: {{ .smtp.username | quote }}
{{- end }}
{{- if .smtp.password }}
- name: TG_SMTP_PASSWORD
  value: {{ .smtp.password | quote }}
{{- end }}
{{- if .smtp.security }}
- name: TG_SMTP_SECURITY
  value: {{ .smtp.security | quote }}
{{- end }}
{{- if .smtp.clientCertFile }}
- name: TG_SMTP_CLIENT_CERT_FILE
  value: {{ .smtp.clientCertFile | quote }}
{{- end }}
{{- if .smtp.clientKeyFile }}
- name: TG_SMTP_CLIENT_KEY_FILE
  value: {{ .smtp.clientKeyFile | quote }}
{{- end }}
{{- if .smtp.clientKeyPassword }}
- name: TG_SMTP_CLIENT_KEY_PASSWORD
  value: {{ .smtp.clientKeyPassword | quote }}
{{- end }}
{{- if .fromAddress }}
- name: TG_EMAIL_FROM_ADDRESS
  value: {{ .fromAddress | quote }}
{{- end }}
{{- end }}
{{- if .Values.testgen.instanceId }}
- name: TG_INSTANCE_ID
  value: {{ .Values.testgen.instanceId | quote }}
{{- end }}
{{- if .Values.testgen.uiBaseUrl }}
- name: TG_UI_BASE_URL
  value: {{ .Values.testgen.uiBaseUrl | quote }}
{{- end }}
{{- if .Values.testgen.baseUrl }}
- name: TG_BASE_URL
  value: {{ .Values.testgen.baseUrl | quote }}
{{- end }}
{{- with .Values.extraEnv }}
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end -}}

{{- define "testgen.hookEnvironment" -}}
{{- if .Values.testgen.uiPassword -}}
- name: TESTGEN_USERNAME
  value: {{ .Values.testgen.uiUser | quote }}
- name: TESTGEN_PASSWORD
  value: {{ .Values.testgen.uiPassword | quote }}
{{- end -}}
{{- end -}}
